  travel: "Viagem",
  shopping: "Compras",
  culture: "Cultura",
};

function TripPlanner() {
  const [tab, setTab] = useState("dashboard");
  const [checklist, setChecklist] = useState(CHECKLIST_DATA);
  const [expandedDay, setExpandedDay] = useState(null);

  const toggleCheck = (catIdx, itemIdx) => {
    setChecklist((prev) => {
      const next = prev.map((cat, ci) => ({
        ...cat,
        items: cat.items.map((item, ii) =>
          ci === catIdx && ii === itemIdx ? { ...item, done: !item.done } : item
        ),
      }));
      return next;
    });
  };

  const totalItems = checklist.reduce((a, c) => a + c.items.length, 0);
  const doneItems = checklist.reduce(
    (a, c) => a + c.items.filter((i) => i.done).length,
    0
  );
  const progress = Math.round((doneItems / totalItems) * 100);

  return (
    <div
      style={{
        fontFamily: "'Outfit', sans-serif",
        background: "#0D0D0D",
        color: "#E8E4DF",
        minHeight: "100vh",
        padding: 0,
        margin: 0,
      }}
    >
      <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />

      {/* Header */}
      <div
        style={{
          padding: "32px 20px 20px",
          borderBottom: "1px solid #222",
        }}
      >
        <div
          style={{
            fontFamily: "'Bebas Neue', sans-serif",
            fontSize: "42px",
            letterSpacing: "3px",
            lineHeight: 1,
            color: "#fff",
          }}
        >
          USA 2026
        </div>
        <div
          style={{
            fontSize: "13px",
            color: "#888",
            marginTop: "4px",
            letterSpacing: "1px",
            textTransform: "uppercase",
          }}
        >
          9 mai — 31 mai · Orlando → Miami → St. Louis
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", gap: "0", marginTop: "20px" }}>
          {[
            { id: "dashboard", label: "Home" },
            { id: "itinerary", label: "Roteiro" },
            { id: "checklist", label: "Check" },
            { id: "tickets", label: "Tickets" },
            { id: "finance", label: "$$$" },
          ].map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                flex: 1,
                padding: "10px 0",
                background: tab === t.id ? "#1A1A1A" : "transparent",
                color: tab === t.id ? "#fff" : "#666",
                border: "none",
                borderBottom: tab === t.id ? "2px solid #FF6B35" : "2px solid transparent",
                fontFamily: "'Outfit', sans-serif",
                fontSize: "13px",
                fontWeight: tab === t.id ? 600 : 400,
                letterSpacing: "1px",
                textTransform: "uppercase",
                cursor: "pointer",
                transition: "all 0.2s",
              }}
            >
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{ padding: "16px 20px 40px" }}>
        {/* DASHBOARD TAB */}
        {tab === "dashboard" && (() => {
          const tripStart = new Date("2026-05-09T00:00:00");
          const tripEnd = new Date("2026-05-30T00:00:00");
          const today = new Date();
          const msDay = 1000 * 60 * 60 * 24;
          const daysToTrip = Math.ceil((tripStart - today) / msDay);
          const totalTripDays = Math.ceil((tripEnd - tripStart) / msDay) + 1;

          const catProgress = checklist.map(c => ({
            name: c.category,
            done: c.items.filter(i => i.done).length,
            total: c.items.length,
            pct: Math.round((c.items.filter(i => i.done).length / c.items.length) * 100),
          }));

          const savedViagem = 8000;
          const goalViagemEst = 10710;
          const pctViagem = Math.min(100, Math.round((savedViagem / goalViagemEst) * 100));
          const remainingViagem = Math.max(0, goalViagemEst - savedViagem);

          const nextPark = ITINERARY[0].days.find(d => d.type === "park");
          const parkCount = ITINERARY.flatMap(p => p.days).filter(d => d.type === "park").length;

          return (
            <div>
              <div style={{background:"linear-gradient(135deg,#FF6B35,#E53935)",borderRadius:"12px",padding:"24px",marginBottom:"16px",textAlign:"center"}}>
                <div style={{fontSize:"10px",letterSpacing:"3px",color:"rgba(255,255,255,0.8)",textTransform:"uppercase",marginBottom:"4px"}}>Faltam</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"72px",letterSpacing:"2px",lineHeight:1,color:"#fff"}}>{daysToTrip > 0 ? daysToTrip : "0"}</div>
                <div style={{fontSize:"12px",color:"rgba(255,255,255,0.9)",marginTop:"4px",letterSpacing:"1px"}}>{daysToTrip > 0 ? "DIAS PARA A VIAGEM" : "VIAGEM EM ANDAMENTO ✈️"}</div>
                <div style={{fontSize:"11px",color:"rgba(255,255,255,0.7)",marginTop:"8px"}}>09/mai → 30/mai · {totalTripDays} dias totais</div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"16px"}}>
                <div style={{background:"#111",borderRadius:"10px",padding:"14px",borderLeft:"3px solid #00BFA6"}}>
                  <div style={{fontSize:"10px",letterSpacing:"1.5px",color:"#888",textTransform:"uppercase"}}>Meta Viagem</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"32px",color:"#00BFA6",lineHeight:1,marginTop:"4px"}}>{pctViagem}%</div>
                  <div style={{fontSize:"10px",color:"#666",marginTop:"4px"}}>${savedViagem.toLocaleString()} / ${goalViagemEst.toLocaleString()}</div>
                  <div style={{height:"3px",background:"#222",borderRadius:"2px",marginTop:"6px",overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${pctViagem}%`,background:"#00BFA6"}}/>
                  </div>
                </div>
                <div style={{background:"#111",borderRadius:"10px",padding:"14px",borderLeft:"3px solid #FFB300"}}>
                  <div style={{fontSize:"10px",letterSpacing:"1.5px",color:"#888",textTransform:"uppercase"}}>Falta Juntar</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"32px",color:"#FFB300",lineHeight:1,marginTop:"4px"}}>${remainingViagem.toLocaleString()}</div>
                  <div style={{fontSize:"10px",color:"#666",marginTop:"4px"}}>≈ R${(remainingViagem*5.0).toLocaleString('pt-BR',{maximumFractionDigits:0})}</div>
                  {daysToTrip > 0 && <div style={{fontSize:"10px",color:"#FFB300",marginTop:"2px"}}>~${Math.round(remainingViagem/daysToTrip)}/dia até a viagem</div>}
                </div>
                <div style={{background:"#111",borderRadius:"10px",padding:"14px",borderLeft:"3px solid #7C4DFF"}}>
                  <div style={{fontSize:"10px",letterSpacing:"1.5px",color:"#888",textTransform:"uppercase"}}>Checklist Total</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"32px",color:"#7C4DFF",lineHeight:1,marginTop:"4px"}}>{progress}%</div>
                  <div style={{fontSize:"10px",color:"#666",marginTop:"4px"}}>{doneItems} de {totalItems} itens</div>
                  <div style={{height:"3px",background:"#222",borderRadius:"2px",marginTop:"6px",overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${progress}%`,background:"#7C4DFF"}}/>
                  </div>
                </div>
                <div style={{background:"#111",borderRadius:"10px",padding:"14px",borderLeft:"3px solid #E91E63"}}>
                  <div style={{fontSize:"10px",letterSpacing:"1.5px",color:"#888",textTransform:"uppercase"}}>Parques</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"32px",color:"#E91E63",lineHeight:1,marginTop:"4px"}}>{parkCount}</div>
                  <div style={{fontSize:"10px",color:"#666",marginTop:"4px"}}>dias de parque</div>
                  <div style={{fontSize:"10px",color:"#E91E63",marginTop:"2px"}}>Disney 5 · Universal 2 · SW 1</div>
                </div>
              </div>

              <div style={{background:"#111",borderRadius:"10px",padding:"16px",marginBottom:"16px"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"16px",letterSpacing:"1.5px",color:"#fff",marginBottom:"12px"}}>PROGRESSO POR CATEGORIA</div>
                {catProgress.map(c => (
                  <div key={c.name} style={{marginBottom:"10px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"4px"}}>
                      <span style={{color:"#ccc"}}>{c.name}</span>
                      <span style={{color:c.pct===100?"#00BFA6":"#888",fontWeight:600}}>{c.done}/{c.total}</span>
                    </div>
                    <div style={{height:"4px",background:"#1a1a1a",borderRadius:"2px",overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${c.pct}%`,background:c.pct===100?"#00BFA6":"#FF6B35",borderRadius:"2px",transition:"width 0.4s"}}/>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{background:"#111",borderRadius:"10px",padding:"16px",marginBottom:"16px"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"16px",letterSpacing:"1.5px",color:"#fff",marginBottom:"12px"}}>FASES DA VIAGEM</div>
                {ITINERARY.map(p => (
                  <div key={p.phase} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1a1a1a"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                      <div style={{width:"4px",height:"20px",background:p.phaseColor,borderRadius:"2px"}}/>
                      <span style={{fontSize:"13px",color:"#ccc"}}>{p.phase}</span>
                    </div>
                    <span style={{fontSize:"12px",color:"#888"}}>{p.days.length} dias</span>
                  </div>
                ))}
              </div>

              <div style={{background:"linear-gradient(135deg,#1a1208,#1a0a0a)",borderRadius:"10px",padding:"16px",border:"1px solid #2a1a1a"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"16px",letterSpacing:"1.5px",color:"#FFB300",marginBottom:"10px"}}>⚡ PRÓXIMOS PASSOS</div>
                {checklist.flatMap(c => c.items.filter(i => !i.done).map(i => ({...i, cat: c.category}))).slice(0, 5).map((item, i) => (
                  <div key={i} style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 0",borderBottom:"1px solid #1a1a1a"}}>
                    <span style={{color:"#FF6B35",fontSize:"10px"}}>●</span>
                    <span style={{fontSize:"12px",color:"#ccc",flex:1}}>{item.label}</span>
                    <span style={{fontSize:"9px",color:"#666",letterSpacing:"0.5px",textTransform:"uppercase"}}>{item.cat}</span>
                  </div>
                ))}
                {checklist.every(c => c.items.every(i => i.done)) && (
                  <div style={{fontSize:"13px",color:"#00BFA6",textAlign:"center",padding:"12px"}}>✅ Tudo pronto! Boa viagem!</div>
                )}
              </div>
            </div>
          );
        })()}

        {/* ITINERARY TAB */}
        {tab === "itinerary" && (
          <div>
            {ITINERARY.map((phase) => (
              <div key={phase.phase} style={{ marginBottom: "32px" }}>
                <div
                  style={{
                    fontFamily: "'Bebas Neue', sans-serif",
                    fontSize: "28px",
                    letterSpacing: "2px",
                    color: phase.phaseColor,
                    marginBottom: "16px",
                    display: "flex",
                    alignItems: "center",
                    gap: "10px",
                  }}
                >
                  <div
                    style={{
                      width: "4px",
                      height: "24px",
                      background: phase.phaseColor,
                      borderRadius: "2px",
                    }}
                  />
                  {phase.phase}
                </div>

                {phase.days.map((day, di) => {
                  const dayKey = `${phase.phase}-${di}`;
                  const isOpen = expandedDay === dayKey;
                  return (
                    <div
                      key={dayKey}
                      style={{
                        background: isOpen ? "#141414" : "#0D0D0D",
                        borderLeft: `3px solid ${typeColors[day.type] || "#444"}`,
                        marginBottom: "8px",
                        borderRadius: "0 8px 8px 0",
                        overflow: "hidden",
                        transition: "background 0.2s",
                      }}
                    >
                      <button
                        onClick={() => setExpandedDay(isOpen ? null : dayKey)}
                        style={{
                          width: "100%",
                          padding: "14px 16px",
                          background: "none",
                          border: "none",
                          color: "#E8E4DF",
                          cursor: "pointer",
                          display: "flex",
                          alignItems: "center",
                          gap: "12px",
                          fontFamily: "'Outfit', sans-serif",
                          textAlign: "left",
                        }}
                      >
                        <span style={{ fontSize: "22px" }}>{day.icon}</span>
                        <div style={{ flex: 1 }}>
                          <div
                            style={{
                              fontSize: "11px",
                              color: "#888",
                              letterSpacing: "0.5px",
                              textTransform: "uppercase",
                            }}
                          >
                            {day.date}
                          </div>
                          <div
                            style={{
                              fontSize: "15px",
                              fontWeight: 600,
                              marginTop: "2px",
                            }}
                          >
                            {day.title}
                          </div>
                        </div>
                        <span
                          style={{
                            fontSize: "10px",
                            background: typeColors[day.type] + "22",
                            color: typeColors[day.type],
                            padding: "3px 8px",
                            borderRadius: "4px",
                            fontWeight: 600,
                            letterSpacing: "0.5px",
                            textTransform: "uppercase",
                          }}
                        >
                          {typeLabels[day.type]}
                        </span>
                        <span
                          style={{
                            color: "#555",
                            fontSize: "18px",
                            transform: isOpen ? "rotate(180deg)" : "rotate(0)",
                            transition: "transform 0.2s",
                          }}
                        >
                          ▾
                        </span>
                      </button>

                      {isOpen && (
                        <div style={{ padding: "0 16px 16px 50px" }}>
                          <ul
                            style={{
                              margin: 0,
                              padding: 0,
                              listStyle: "none",
                            }}
                          >
                            {day.items.map((item, ii) => (
                              <li
                                key={ii}
                                style={{
                                  padding: "6px 0",
                                  fontSize: "14px",
                                  color: "#ccc",
                                  borderBottom: "1px solid #1a1a1a",
                                  display: "flex",
                                  alignItems: "flex-start",
                                  gap: "8px",
                                }}
                              >
                                <span
                                  style={{
                                    color: typeColors[day.type],
                                    marginTop: "2px",
                                    fontSize: "8px",
                                  }}
                                >
                                  ●
                                </span>
                                {item}
                              </li>
                            ))}
                          </ul>
                          {day.places && day.places.length > 0 && (
                            <div style={{marginTop:"12px"}}>
                              <div style={{fontSize:"10px",fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"#666",marginBottom:"6px"}}>Deslocamentos</div>
                              {day.places.map((p, pi) => (
                                <div key={pi} style={{background:"#1A1A1A",borderRadius:"6px",padding:"10px 12px",marginBottom:"6px",borderLeft:`2px solid ${typeColors[day.type]}44`}}>
                                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
                                    <div style={{flex:1,minWidth:0}}>
                                      <div style={{fontSize:"13px",fontWeight:600,color:"#fff"}}>{p.name}</div>
                                      <div style={{fontSize:"11px",color:"#888",marginTop:"2px"}}>{p.address}</div>
                                      {p.from && (
                                        <div style={{fontSize:"10px",color:"#FFB300",marginTop:"4px",letterSpacing:"0.5px"}}>
                                          ↳ de {p.from} · {p.distance} · {p.time}
                                        </div>
                                      )}
                                    </div>
                                    <a
                                      href={`https://waze.com/ul?q=${encodeURIComponent(p.address)}&navigate=yes`}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      style={{
                                        background:"#33CCFF",
                                        color:"#000",
                                        padding:"6px 10px",
                                        borderRadius:"5px",
                                        fontSize:"10px",
                                        fontWeight:700,
                                        letterSpacing:"0.5px",
                                        textDecoration:"none",
                                        whiteSpace:"nowrap",
                                        flexShrink:0,
                                      }}
                                    >
                                      ▶ WAZE
                                    </a>
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                          {day.tip && (
                            <div
                              style={{
                                marginTop: "12px",
                                padding: "10px 12px",
                                background: "#1A1A1A",
                                borderRadius: "6px",
                                fontSize: "12px",
                                color: "#999",
                                lineHeight: 1.5,
                                borderLeft: `2px solid ${typeColors[day.type]}44`,
                              }}
                            >
                              <span style={{ color: "#FFB300", marginRight: "6px" }}>💡</span>
                              {day.tip}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}

        {/* CHECKLIST TAB */}
        {tab === "checklist" && (
          <div>
            <div style={{ marginBottom: "24px" }}>
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "baseline",
                  marginBottom: "8px",
                }}
              >
                <span
                  style={{
                    fontFamily: "'Bebas Neue', sans-serif",
                    fontSize: "24px",
                    letterSpacing: "2px",
                    color: "#fff",
                  }}
                >
                  PRÉ-VIAGEM
                </span>
                <span
                  style={{
                    fontSize: "13px",
                    color: progress === 100 ? "#00BFA6" : "#888",
                    fontWeight: 600,
                  }}
                >
                  {doneItems}/{totalItems} · {progress}%
                </span>
              </div>
              <div
                style={{
                  height: "3px",
                  background: "#222",
                  borderRadius: "2px",
                  overflow: "hidden",
                }}
              >
                <div
                  style={{
                    height: "100%",
                    width: `${progress}%`,
                    background: progress === 100
                      ? "#00BFA6"
                      : "linear-gradient(90deg, #FF6B35, #FFB300)",
                    borderRadius: "2px",
                    transition: "width 0.3s",
                  }}
                />
              </div>
            </div>

            {checklist.map((cat, catIdx) => (
              <div key={cat.category} style={{ marginBottom: "24px" }}>
                <div
                  style={{
                    fontSize: "11px",
                    fontWeight: 700,
                    letterSpacing: "2px",
                    textTransform: "uppercase",
                    color: "#666",
                    marginBottom: "8px",
                    paddingLeft: "4px",
                  }}
                >
                  {cat.category}
                </div>
                {cat.items.map((item, itemIdx) => (
                  <button
                    key={item.id}
                    onClick={() => toggleCheck(catIdx, itemIdx)}
                    style={{
                      width: "100%",
                      display: "flex",
                      alignItems: "center",
                      gap: "12px",
                      padding: "12px",
                      background: item.done ? "#0f1a0f" : "#111",
                      border: "none",
                      borderRadius: "6px",
                      marginBottom: "4px",
                      cursor: "pointer",
                      transition: "all 0.15s",
                      fontFamily: "'Outfit', sans-serif",
                      textAlign: "left",
                    }}
                  >
                    <div
                      style={{
                        width: "20px",
                        height: "20px",
                        borderRadius: "4px",
                        border: item.done ? "none" : "2px solid #444",
                        background: item.done ? "#00BFA6" : "transparent",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        flexShrink: 0,
                        transition: "all 0.15s",
                      }}
                    >
                      {item.done && (
                        <span style={{ color: "#000", fontSize: "13px", fontWeight: 700 }}>
                          ✓
                        </span>
                      )}
                    </div>
                    <span
                      style={{
                        fontSize: "14px",
                        color: item.done ? "#5a7a5a" : "#ccc",
                        textDecoration: item.done ? "line-through" : "none",
                        transition: "all 0.15s",
                      }}
                    >
                      {item.label}
                    </span>
                  </button>
                ))}
              </div>
            ))}
          </div>
        )}

        {/* TICKETS TAB */}
        {tab === "tickets" && (
          <div>
            <div
              style={{
                fontFamily: "'Bebas Neue', sans-serif",
                fontSize: "24px",
                letterSpacing: "2px",
                color: "#fff",
                marginBottom: "4px",
              }}
            >
              INGRESSOS & TICKETS
            </div>
            <div
              style={{
                fontSize: "12px",
                color: "#888",
                marginBottom: "24px",
                lineHeight: 1.5,
              }}
            >
              Preços pesquisados em abril/2026. Valores em USD, antes de tax (6.5%).
              Filha com 2a8m = grátis na Disney e SeaWorld.
            </div>

            {TICKETS.map((t) => (
              <div
                key={t.park}
                style={{
                  background: "#111",
                  borderRadius: "10px",
                  padding: "20px",
                  marginBottom: "16px",
                }}
              >
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: "10px",
                    marginBottom: "12px",
                  }}
                >
                  <span style={{ fontSize: "28px" }}>{t.emoji}</span>
                  <div>
                    <div
                      style={{
                        fontFamily: "'Bebas Neue', sans-serif",
                        fontSize: "22px",
                        letterSpacing: "1px",
                        color: "#fff",
                      }}
                    >
                      {t.park}
                    </div>
                    <div
                      style={{
                        fontSize: "13px",
                        color: "#FF6B35",
                        fontWeight: 600,
                      }}
                    >
                      {t.estimatedCost}
                    </div>
                  </div>
                </div>

                <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                  {t.details.map((d, i) => (
                    <li
                      key={i}
                      style={{
                        padding: "5px 0",
                        fontSize: "13px",
                        color: "#aaa",
                        display: "flex",
                        gap: "8px",
                        alignItems: "flex-start",
                      }}
                    >
                      <span style={{ color: "#444", marginTop: "3px", fontSize: "6px" }}>●</span>
                      {d}
                    </li>
                  ))}
                </ul>

                <div
                  style={{
                    marginTop: "14px",
                    padding: "12px",
                    background: "#0a1a0a",
                    borderRadius: "6px",
                    borderLeft: "3px solid #00BFA6",
                  }}
                >
                  <div
                    style={{
                      fontSize: "10px",
                      fontWeight: 700,
                      letterSpacing: "1.5px",
                      textTransform: "uppercase",
                      color: "#00BFA6",
                      marginBottom: "4px",
                    }}
                  >
                    Recomendação
                  </div>
                  <div style={{ fontSize: "13px", color: "#ccc", lineHeight: 1.5 }}>
                    {t.recommendation}
                  </div>
                </div>

                <div style={{ marginTop: "12px" }}>
                  <div
                    style={{
                      fontSize: "10px",

              title: "ALUGUEL DE CARRO — ORLANDO (14 dias)",

            {

                { label: "Brickell Arch Residences (3 noites, tudo incluído)", value: 950, card: true },
                { label: "Voos MCO↔MIA Spirit (3 pax, ida+volta, sem bagagem)", value: 300, card: true },
                { label: "Porsche 3 dias (Turo Miami, confirmado)", value: 780 },
                { label: "Combustível premium Porsche", value: 80 },
                { label: "Uber ocasional em Miami", value: 120 },

            {
              title: "ST. LOUIS + ORLANDO FINAL",
              icon: "🌆",
              color: "#E53935",
              items: [
                { label: "Voo Orlando → St. Louis (3 pax)", value: 450 },
                { label: "Voo St. Louis → Orlando (3 pax)", value: 450 },
                { label: "Hotel perto MCO (9, 24, 28, 29/mai · 4 noites)", value: 560, card: true },

                      <div style={{height:"100%",width:`${pct}%`,background:pct>=100?"#00BFA6":color,borderRadius:"2px",transition:"width 0.4s"}}/>

                  </div>
                );

                      pct={pctViagem}
                      remaining={remainingViagem}
                      color="#00BFA6"
                      gradient="linear-gradient(135deg,#0a1a14,#0a0f1a)"
                    />
                    <GoalCard
                      title="META APPLE"
                      subtitle="LUXO · iPhones + AirPods (compra planejada)"

                      goal={goalApple}
                      pct={pctApple}
                      remaining={remainingApple}
                      color="#A0A0A0"
                      gradient="linear-gradient(135deg,#151515,#0a0a14)"
                    />

                      <span style={{fontSize:"13px",fontWeight:700,color:s.color}}>${sub.toLocaleString()}</span>
                    </div>
                    {s.items.map((i, idx) => (
                      <div key={idx} style={{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#aaa",padding:"3px 0",gap:"8px"}}>

                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"10px"}}>
                  <span style={{fontSize:"13px",color:"#7eb6ff"}}>💳 No cartão (parcelado)</span>

                  </div>
                </div>
                <div style={{fontSize:"11px",color:"#666",marginTop:"8px"}}>Família de 3 (Olivia grátis em vários lugares) · 22 dias</div>

              {bonus && (
                <div style={{background:"#0a0f1a",borderRadius:"10px",padding:"18px",marginTop:"16px",border:"1px dashed #444"}}>
                  <div style={{fontSize:"10px",letterSpacing:"2px",color:"#888",marginBottom:"4px"}}>OPCIONAL</div>

                    <div key={idx} style={{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#aaa",padding:"3px 0"}}>
                      <span>{i.label}</span>

        })()}

}
