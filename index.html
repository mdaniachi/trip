<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USA 2026</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --ios-blue: #0A84FF;
            --ios-green: #30D158;
            --ios-bg: #000000;
            --ios-secondary-bg: #1C1C1E;
            --ios-tertiary-bg: #2C2C2E;
            --ios-label: #FFFFFF;
            --ios-secondary-label: #8E8E93;
            --ios-separator: #38383A;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--ios-bg);
            color: var(--ios-label);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }

        /* Estilo Inset Grouped da Apple */
        .ios-list {
            background: var(--ios-secondary-bg);
            border-radius: 12px;
            margin: 0 16px 20px 16px;
            overflow: hidden;
        }

        .ios-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--ios-separator);
            transition: background 0.2s;
        }

        .ios-item:last-child { border-bottom: none; }

        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 84px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
            border-top: 0.5px solid var(--ios-separator);
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ios-secondary-label);
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
        }

        .tab-item.active { color: var(--ios-blue); }

        .ios-title {
            font-size: 34px;
            font-weight: 700;
            padding: 40px 16px 10px 16px;
            letter-spacing: -1px;
        }

        input, select {
            background: var(--ios-tertiary-bg);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect } = React;

// --- Reaproveitando lógica de LocalStorage do modelo anterior ---
function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = window.localStorage.getItem(key);
      return item ? JSON.parse(item) : initialValue;
    } catch (error) { return initialValue; }
  });
  useEffect(() => { window.localStorage.setItem(key, JSON.stringify(storedValue)); }, [key, storedValue]);
  return [storedValue, setStoredValue];
}

// --- Dados de estrutura mantidos conforme arquivo original ---
const CHECKLIST_DATA = [
  { category: "Documentação", items: [{ id: "passaportes", label: "Passaportes válidos", done: false }, { id: "visto", label: "Vistos americanos", done: false }, { id: "seguro", label: "Seguro viagem", done: false }] },
  { category: "Transporte", items: [{ id: "passagens", label: "Passagens aéreas", done: true }, { id: "aluguel_carro", label: "Aluguel de carro", done: false }] }
];

const ITINERARY = [
  { phase: "Orlando", color: "#FF9500", days: [{ date: "09/mai", title: "Chegada", icon: "✈️", type: "travel" }, { date: "10/mai", title: "SeaWorld", icon: "🐬", type: "park" }] },
  { phase: "Miami", color: "#30D158", days: [{ date: "21/mai", title: "Wynwood", icon: "🎨", type: "culture" }] }
];

// --- Componentes de Aba Estilo Apple ---

function DashboardTab({ savedViagem, goalViagem }) {
  const pct = Math.min(100, Math.round((savedViagem / goalViagem) * 100));
  return (
    <div style={{paddingBottom: "100px"}}>
      <div className="ios-title">Resumo</div>
      
      <div className="ios-list" style={{padding: "20px", background: "linear-gradient(180deg, #1C1C1E 0%, #000 100%)", border: "1px solid #2C2C2E"}}>
        <div style={{fontSize: "13px", color: "#8E8E93", textTransform: "uppercase", fontWeight: "600"}}>Meta de Economia</div>
        <div style={{fontSize: "34px", fontWeight: "800", margin: "8px 0"}}>${savedViagem.toLocaleString()}</div>
        <div style={{height: "8px", background: "#38383A", borderRadius: "4px", overflow: "hidden"}}>
            <div style={{height: "100%", width: `${pct}%`, background: "var(--ios-blue)", borderRadius: "4px"}} />
        </div>
        <div style={{fontSize: "13px", color: "#8E8E93", marginTop: "8px"}}>{pct}% da meta de ${goalViagem.toLocaleString()}</div>
      </div>

      <div className="ios-list">
        <div className="ios-item" style={{justifyContent: "space-between"}}>
            <span>Dias para a viagem</span>
            <span style={{color: "var(--ios-blue)", fontWeight: "600"}}>22 dias</span>
        </div>
        <div className="ios-item" style={{justifyContent: "space-between"}}>
            <span>Parques Planejados</span>
            <span style={{color: "var(--ios-blue)", fontWeight: "600"}}>8</span>
        </div>
      </div>
    </div>
  );
}

function ChecklistTab({ checklist, setChecklist }) {
  const toggle = (catIdx, itemIdx) => {
    const next = [...checklist];
    next[catIdx].items[itemIdx].done = !next[catIdx].items[itemIdx].done;
    setChecklist(next);
  };

  return (
    <div style={{paddingBottom: "100px"}}>
      <div className="ios-title">Checklist</div>
      {checklist.map((cat, ci) => (
        <div key={ci}>
          <div style={{fontSize: "13px", color: "#8E8E93", textTransform: "uppercase", margin: "0 32px 8px"}}> {cat.category} </div>
          <div className="ios-list">
            {cat.items.map((item, ii) => (
              <div key={ii} className="ios-item" onClick={() => toggle(ci, ii)}>
                <div style={{
                    width: "22px", height: "22px", borderRadius: "50%", 
                    border: item.done ? "none" : "2px solid #38383A",
                    background: item.done ? "var(--ios-blue)" : "transparent",
                    marginRight: "12px", display: "flex", alignItems: "center", justifyContent: "center"
                }}>
                  {item.done && <span style={{fontSize: "12px"}}>✓</span>}
                </div>
                <span style={{color: item.done ? "#8E8E93" : "white"}}>{item.label}</span>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function DocsTab({ docs, setDocs }) {
  const [title, setTitle] = useState('');
  const [code, setCode] = useState('');

  const add = () => {
    if(!title) return;
    setDocs([...docs, { title, code, id: Date.now() }]);
    setTitle(''); setCode('');
  };

  return (
    <div style={{paddingBottom: "100px"}}>
      <div className="ios-title">Documentos</div>
      
      <div className="ios-list" style={{padding: "16px", display: "flex", flexDirection: "column", gap: "10px"}}>
        <input placeholder="Título (ex: Passagem GOL)" value={title} onChange={e=>setTitle(e.target.value)} />
        <input placeholder="Código de Reserva" value={code} onChange={e=>setCode(e.target.value)} />
        <button onClick={add} style={{background: "var(--ios-blue)", color: "white", padding: "12px", borderRadius: "10px", border: "none", fontWeight: "600"}}>Adicionar</button>
      </div>

      <div className="ios-list">
        {docs.map(doc => (
          <div key={doc.id} className="ios-item" style={{justifyContent: "space-between"}}>
            <div>
              <div style={{fontWeight: "600"}}>{doc.title}</div>
              <div style={{fontSize: "12px", color: "#8E8E93"}}>{doc.code}</div>
            </div>
            <div style={{color: "var(--ios-blue)", fontSize: "20px"}}>ⓘ</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// --- App Principal ---

function AppleTripApp() {
  const [tab, setTab] = useState('home');
  const [checklist, setChecklist] = useLocalStorage("ios_check", CHECKLIST_DATA);
  const [saved, setSaved] = useLocalStorage("ios_saved", 8000);
  const [docs, setDocs] = useLocalStorage("ios_docs", []);

  return (
    <div>
      {tab === 'home' && <DashboardTab savedViagem={saved} goalViagem={10710} />}
      {tab === 'check' && <ChecklistTab checklist={checklist} setChecklist={setChecklist} />}
      {tab === 'docs' && <DocsTab docs={docs} setDocs={setDocs} />}
      
      {/* Tab Bar Nativa do iOS */}
      <div className="tab-bar">
        <button className={`tab-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}>
          <div style={{fontSize: "24px"}}>🏠</div>
          <span>Home</span>
        </button>
        <button className={`tab-item ${tab==='check'?'active':''}`} onClick={()=>setTab('check')}>
          <div style={{fontSize: "24px"}}>✅</div>
          <span>Checklist</span>
        </button>
        <button className={`tab-item ${tab==='docs'?'active':''}`} onClick={()=>setTab('docs')}>
          <div style={{fontSize: "24px"}}>📄</div>
          <span>Docs</span>
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppleTripApp />);
    </script>
</body>
</html>
