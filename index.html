<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USA 2026 Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="USA 2026">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-bg: #000000;
            --ios-card: #1C1C1E;
            --ios-text: #FFFFFF;
            --ios-secondary-text: #8E8E93;
            --ios-separator: #38383A;
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Layout Estrutural */
        .app-container { padding-bottom: calc(90px + var(--safe-area-bottom)); }
        .content-padding { padding: 0 16px; }

        /* Títulos Apple Style */
        .large-title {
            font-size: 34px;
            font-weight: 700;
            padding: calc(40px + var(--safe-area-top)) 16px 10px;
            letter-spacing: -1px;
        }

        /* Cartões Inset Grouped */
        .ios-card {
            background: var(--ios-card);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .ios-row {
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--ios-separator);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ios-row:last-child { border-bottom: none; }

        /* Navegação Inferior */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%;
            height: calc(65px + var(--safe-area-bottom));
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex; justify-content: space-around;
            padding-top: 10px;
            border-top: 0.5px solid var(--ios-separator);
            z-index: 1000;
        }

        .tab-item {
            background: none; border: none; color: var(--ios-secondary-text);
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; cursor: pointer;
        }
        .tab-item.active { color: var(--ios-blue); }
        .tab-icon { font-size: 22px; margin-bottom: 4px; }

        /* Botão Apple */
        .ios-button {
            background: var(--ios-blue);
            color: white; border: none;
            padding: 14px; border-radius: 12px;
            font-weight: 600; width: 100%; font-size: 16px;
        }

        /* Animação suave */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect, useMemo } = React;

// --- DADOS DO ROTEIRO COMPLETO (Sua base original) ---
const ORIGINAL_ITINERARY = [
  {
    phase: "Orlando · Fase 1", color: "#FF9500",
    days: [
      { date: "09/mai (sáb)", title: "Chegada em Orlando", icon: "✈️", type: "travel", items: ["Chegada MCO 17:30", "Pegar Wrangler (Turo)", "Supermercado Walmart"], tip: "Primeira noite perto do aeroporto." },
      { date: "10/mai (dom)", title: "SeaWorld Orlando", icon: "🐬", type: "park", items: ["Check-in Vacation Village", "Shows: Orca e Dolphin", "Sesame Street Land"], tip: "Olivia entra grátis!" },
      { date: "11/mai (seg)", title: "Magic Kingdom", icon: "🏰", type: "park", items: ["Foco: Fantasyland", "Almoço Columbia Harbour", "Show de Fogos"], tip: "Levem o carrinho reclinável." },
      { date: "12/mai (ter)", title: "Descanso + Outlets", icon: "🛍️", type: "rest", items: ["Piscina Resort", "Vineland Premium Outlets"], tip: "Aproveite os cupons no app Simon." },
      { date: "13/mai (qua)", title: "Animal Kingdom", icon: "🦁", type: "park", items: ["Safári bem cedo", "Na'vi River Journey", "Festival of the Lion King"] },
      { date: "14/mai (qui)", title: "EPCOT", icon: "🌍", type: "park", items: ["Guardians of the Galaxy", "World Showcase", "Show Luminous"] },
      { date: "15/mai (sex)", title: "Universal Studios", icon: "⚡", type: "park", items: ["Diagon Alley", "Hogwarts Express", "Hogsmeade"] },
      { date: "16/mai (sáb)", title: "Cars & Coffee", icon: "🏎️", type: "rest", items: ["8:00 House Blend Cafe", "Disney Springs tarde"] },
      { date: "18/mai (seg)", title: "Universal Epic Universe", icon: "🍄", type: "park", items: ["Super Nintendo World", "Isle of Berk", "Dark Universe"] },
      { date: "19/mai (ter)", title: "Hollywood Studios", icon: "🎬", type: "park", items: ["Star Wars: Galaxy's Edge", "Toy Story Land"] }
    ]
  },
  {
    phase: "Miami", color: "#30D158",
    days: [
      { date: "21/mai (qui)", title: "Voo p/ Miami + Wynwood", icon: "🏎️", type: "travel", items: ["Voo MCO-MIA Spirit", "Pegar Porsche Turo", "Wynwood Walls"] },
      { date: "22/mai (sex)", title: "Art Deco + South Beach", icon: "🏖️", type: "culture", items: ["Walking Tour South Beach", "Lincoln Road Mall"] }
    ]
  }
];

// --- LOGICA DE PERSISTÊNCIA ---
function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = window.localStorage.getItem(key);
      return item ? JSON.parse(item) : initialValue;
    } catch (e) { return initialValue; }
  });
  useEffect(() => { window.localStorage.setItem(key, JSON.stringify(storedValue)); }, [key, storedValue]);
  return [storedValue, setStoredValue];
}

// --- COMPONENTES DE ABA ---

function TodayView({ itinerary }) {
  // Simulação de detecção de data (ou manual para teste)
  const todayStr = "11/mai (seg)"; 
  const currentDay = useMemo(() => {
    return itinerary.flatMap(p => p.days).find(d => d.date.includes(todayStr));
  }, [itinerary]);

  return (
    <div className="fade-in">
      <div className="large-title">Hoje</div>
      <div className="content-padding">
        {currentDay ? (
          <div className="ios-card">
            <div className="ios-row">
              <span style={{fontSize: '24px'}}>{currentDay.icon}</span>
              <div style={{flex: 1, marginLeft: '12px'}}>
                <div style={{fontWeight: '700', fontSize: '18px'}}>{currentDay.title}</div>
                <div style={{color: 'var(--ios-secondary-text)', fontSize: '14px'}}>{currentDay.date}</div>
              </div>
            </div>
            {currentDay.items.map((item, i) => (
              <div key={i} className="ios-row" style={{justifyContent: 'flex-start', fontSize: '15px'}}>
                <span style={{color: 'var(--ios-blue)', marginRight: '10px'}}>•</span> {item}
              </div>
            ))}
            <div style={{padding: '12px 16px', background: '#2C2C2E', fontSize: '13px', color: '#FFD60A'}}>
              💡 {currentDay.tip}
            </div>
          </div>
        ) : (
          <div className="ios-card" style={{padding: '20px', textAlign: 'center', color: '#8E8E93'}}>
            Nenhuma atividade programada para hoje. Aproveite o descanso!
          </div>
        )}
      </div>
    </div>
  );
}

function ItineraryView({ itinerary }) {
  return (
    <div className="fade-in">
      <div className="large-title">Roteiro</div>
      <div className="content-padding">
        {itinerary.map((phase, pi) => (
          <div key={pi}>
            <div style={{color: phase.color, fontWeight: '700', fontSize: '13px', margin: '0 0 8px 4px', textTransform: 'uppercase'}}>{phase.phase}</div>
            <div className="ios-card">
              {phase.days.map((day, di) => (
                <div key={di} className="ios-row">
                  <div style={{display: 'flex', alignItems: 'center'}}>
                    <span style={{fontSize: '20px', marginRight: '12px'}}>{day.icon}</span>
                    <div>
                      <div style={{fontSize: '15px', fontWeight: '600'}}>{day.title}</div>
                      <div style={{fontSize: '12px', color: '#8E8E93'}}>{day.date}</div>
                    </div>
                  </div>
                  <div style={{fontSize: '18px', color: '#38383A'}}>›</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function FinanceView({ saved, setSaved, totalGoal }) {
  const pct = Math.round((saved / totalGoal) * 100);
  return (
    <div className="fade-in">
      <div className="large-title">Finanças</div>
      <div className="content-padding">
        <div className="ios-card" style={{padding: '20px', background: 'linear-gradient(180deg, #1C1C1E 0%, #000 100%)'}}>
          <div style={{color: '#8E8E93', fontSize: '12px', fontWeight: '600'}}>TOTAL ECONOMIZADO</div>
          <div style={{fontSize: '36px', fontWeight: '800', margin: '8px 0'}}>${saved.toLocaleString()}</div>
          <div style={{height: '8px', background: '#38383A', borderRadius: '4px', overflow: 'hidden'}}>
            <div style={{width: `${pct}%`, height: '100%', background: 'var(--ios-blue)'}} />
          </div>
          <div style={{display: 'flex', justifyContent: 'space-between', marginTop: '10px', fontSize: '12px', color: '#8E8E93'}}>
            <span>{pct}% da meta</span>
            <span>Faltam ${(totalGoal - saved).toLocaleString()}</span>
          </div>
        </div>

        <div style={{fontSize: '13px', color: '#8E8E93', margin: '0 4px 8px'}}>LANÇAR ECONOMIA</div>
        <div className="ios-card" style={{padding: '16px'}}>
          <input 
            type="number" 
            placeholder="Valor em USD"
            style={{width: '100%', background: '#2C2C2E', border: 'none', padding: '12px', borderRadius: '8px', color: 'white', fontSize: '16px'}}
            onKeyDown={(e) => {
              if(e.key === 'Enter') {
                setSaved(prev => prev + Number(e.target.value));
                e.target.value = '';
              }
            }}
          />
          <div style={{fontSize: '11px', color: '#444', marginTop: '8px', textAlign: 'center'}}>Pressione Enter para somar ao total</div>
        </div>
      </div>
    </div>
  );
}

function DocsView({ docs, setDocs }) {
  const [newDoc, setNewDoc] = useState({ title: '', code: '' });
  return (
    <div className="fade-in">
      <div className="large-title">Docs</div>
      <div className="content-padding">
        <div className="ios-card" style={{padding: '16px'}}>
          <input placeholder="Título (ex: Voo Spirit)" style={{width: '93%', background: '#2C2C2E', border: 'none', padding: '12px', borderRadius: '8px', color: 'white', marginBottom: '10px'}} onChange={e=>setNewDoc({...newDoc, title: e.target.value})} />
          <input placeholder="Confirmação / Código" style={{width: '93%', background: '#2C2C2E', border: 'none', padding: '12px', borderRadius: '8px', color: 'white', marginBottom: '10px'}} onChange={e=>setNewDoc({...newDoc, code: e.target.value})} />
          <button className="ios-button" onClick={() => {
            if(newDoc.title) { setDocs([...docs, {...newDoc, id: Date.now()}]); setNewDoc({title:'', code:''}); }
          }}>Salvar Documento</button>
        </div>

        {docs.length > 0 && (
          <div className="ios-card">
            {docs.map(doc => (
              <div key={doc.id} className="ios-row">
                <div>
                  <div style={{fontWeight: '600'}}>{doc.title}</div>
                  <div style={{fontSize: '12px', color: '#8E8E93'}}>{doc.code}</div>
                </div>
                <button style={{background: 'none', border: 'none', color: '#FF453A'}} onClick={() => setDocs(docs.filter(d=>d.id!==doc.id))}>Remover</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// --- APP PRINCIPAL ---

function AppleTripApp() {
  const [tab, setTab] = useState('today');
  
  // Dados persistentes
  const [saved, setSaved] = useLocalStorage("usa2026_saved", 8000);
  const [docs, setDocs] = useLocalStorage("usa2026_docs", []);
  
  return (
    <div className="app-container">
      {tab === 'today' && <TodayView itinerary={ORIGINAL_ITINERARY} />}
      {tab === 'itinerary' && <ItineraryView itinerary={ORIGINAL_ITINERARY} />}
      {tab === 'finance' && <FinanceView saved={saved} setSaved={setSaved} totalGoal={10710} />}
      {tab === 'docs' && <DocsView docs={docs} setDocs={setDocs} />}

      <nav className="tab-bar">
        <button className={`tab-item ${tab==='today'?'active':''}`} onClick={()=>setTab('today')}>
          <span className="tab-icon">􀉉</span>
          <span>Hoje</span>
        </button>
        <button className={`tab-item ${tab==='itinerary'?'active':''}`} onClick={()=>setTab('itinerary')}>
          <span className="tab-icon">􀈟</span>
          <span>Roteiro</span>
        </button>
        <button className={`tab-item ${tab==='finance'?'active':''}`} onClick={()=>setTab('finance')}>
          <span className="tab-icon">􀖀</span>
          <span>Finanças</span>
        </button>
        <button className={`tab-item ${tab==='docs'?'active':''}`} onClick={()=>setTab('docs')}>
          <span className="tab-icon">􀈦</span>
          <span>Docs</span>
        </button>
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppleTripApp />);
    </script>
</body>
</html>
