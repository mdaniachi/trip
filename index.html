function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = window.localStorage.getItem(key);
      return item ? JSON.parse(item) : initialValue;
    } catch (error) {
      console.warn(error);
      return initialValue;
    }
  });

  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(storedValue));
    } catch (error) {
      console.warn(error);
    }
  }, [key, storedValue]);

  return [storedValue, setStoredValue];
}

function ItineraryTab() {
  const [expandedDay, setExpandedDay] = useState(null);
  
  return (
    <div>
      {ITINERARY.map((phase) => (
        <div key={phase.phase} style={{ marginBottom: "32px" }}>
          <div style={{fontFamily:"'Bebas Neue', sans-serif",fontSize:"28px",letterSpacing:"2px",color:phase.phaseColor,marginBottom:"16px",display:"flex",alignItems:"center",gap:"10px"}}>
            <div style={{width:"4px",height:"24px",background:phase.phaseColor,borderRadius:"2px"}}/>
            {phase.phase}
          </div>
          {phase.days.map((day, di) => {
            const dayKey = `${phase.phase}-${di}`;
            const isOpen = expandedDay === dayKey;
            return (
              <div key={dayKey} style={{background:isOpen?"#141414":"#111",borderLeft:`3px solid ${typeColors[day.type]}`,marginBottom:"8px",borderRadius:"0 8px 8px 0",overflow:"hidden"}}>
                <button onClick={() => setExpandedDay(isOpen ? null : dayKey)} style={{width:"100%",padding:"14px 16px",background:"none",border:"none",color:"#E8E4DF",cursor:"pointer",display:"flex",alignItems:"center",gap:"12px",textAlign:"left"}}>
                  <span style={{fontSize:"22px"}}>{day.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:"11px",color:"#888",textTransform:"uppercase"}}>{day.date}</div>
                    <div style={{fontSize:"15px",fontWeight:600}}>{day.title}</div>
                  </div>
                  <span style={{color:"#555",fontSize:"18px",transform:isOpen?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s"}}>▾</span>
                </button>
                {isOpen && (
                  <div style={{padding:"0 16px 16px 50px"}}>
                    <ul style={{margin:0,padding:0,listStyle:"none"}}>
                      {day.items.map((item, ii) => (
                        <li key={ii} style={{padding:"6px 0",fontSize:"13px",color:"#ccc",borderBottom:"1px solid #1a1a1a",display:"flex",gap:"8px"}}>
                          <span style={{color:typeColors[day.type],fontSize:"8px",marginTop:"3px"}}>●</span>{item}
                        </li>
                      ))}
                    </ul>
                    {day.tip && <div style={{marginTop:"12px",padding:"10px",background:"#1A1A1A",borderRadius:"6px",fontSize:"12px",color:"#999",borderLeft:`2px solid ${typeColors[day.type]}44`}}>💡 {day.tip}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function ChecklistTab({ checklist, setChecklist }) {
  const toggleCheck = (catIdx, itemIdx) => {
    setChecklist(prev => prev.map((cat, ci) => ({
      ...cat, items: cat.items.map((item, ii) => ci === catIdx && ii === itemIdx ? { ...item, done: !item.done } : item)
    })));
  };

  const totalItems = checklist.reduce((a, c) => a + c.items.length, 0);
  const doneItems = checklist.reduce((a, c) => a + c.items.filter((i) => i.done).length, 0);
  const progress = Math.round((doneItems / totalItems) * 100);

  return (
    <div>
      <div style={{marginBottom:"24px", display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
        <span style={{fontFamily:"'Bebas Neue', sans-serif",fontSize:"24px",letterSpacing:"2px",color:"#fff"}}>PRÉ-VIAGEM</span>
        <span style={{fontSize:"13px",color:progress===100?"#00BFA6":"#888",fontWeight:600}}>{progress}% concluído</span>
      </div>
      {checklist.map((cat, catIdx) => (
        <div key={cat.category} style={{marginBottom:"24px"}}>
          <div style={{fontSize:"11px",fontWeight:700,letterSpacing:"2px",textTransform:"uppercase",color:"#666",marginBottom:"8px"}}>{cat.category}</div>
          {cat.items.map((item, itemIdx) => (
            <button key={item.id} onClick={() => toggleCheck(catIdx, itemIdx)} style={{width:"100%",display:"flex",alignItems:"center",gap:"12px",padding:"12px",background:item.done?"#0f1a0f":"#111",border:"none",borderRadius:"6px",marginBottom:"4px",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:"20px",height:"20px",borderRadius:"4px",border:item.done?"none":"2px solid #444",background:item.done?"#00BFA6":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {item.done && <span style={{color:"#000",fontSize:"13px",fontWeight:700}}>✓</span>}
              </div>
              <span style={{fontSize:"14px",color:item.done?"#5a7a5a":"#ccc",textDecoration:item.done?"line-through":"none"}}>{item.label}</span>
            </button>
          ))}
        </div>
      ))}
    </div>
  );
}

          </div>
          <ul style={{margin:0,padding:0,listStyle:"none"}}>
            {t.details.map((d, i) => <li key={i} style={{padding:"4px 0",fontSize:"13px",color:"#aaa"}}>● {d}</li>)}
          </ul>
          <div style={{marginTop:"14px",padding:"12px",background:"#0a1a0a",borderRadius:"6px",borderLeft:"3px solid #00BFA6",fontSize:"13px",color:"#ccc"}}><strong style={{color:"#00BFA6"}}>Dica:</strong> {t.recommendation}</div>
          <a href={t.buyLink} target="_blank" rel="noopener noreferrer" style={{display:"inline-block",marginTop:"12px",fontSize:"12px",color:"#33CCFF",textDecoration:"none"}}>🔗 Comprar no Site Oficial</a>
        </div>
      ))}
    </div>
  );
}

function FinanceTab({ savedViagem, setSavedViagem, savedApple, setSavedApple, viagemCash, appleCash }) {
  const pctViagem = Math.min(100, Math.round((savedViagem / viagemCash) * 100));
  const pctApple = appleCash > 0 ? Math.min(100, Math.round((savedApple / appleCash) * 100)) : 0;
  
  return (
    <div>
      <div style={{fontFamily:"'Bebas Neue', sans-serif",fontSize:"24px",letterSpacing:"2px",color:"#fff",marginBottom:"4px"}}>FINANCEIRO</div>
      <div style={{fontSize:"12px",color:"#888",marginBottom:"20px"}}>Câmbio referência: R$5,00/USD. Estimativas em USD.</div>

      {/* Painel Editável de Metas */}
      <div style={{background:"#111",borderRadius:"10px",padding:"16px",marginBottom:"24px",border:"1px solid #333"}}>
        <div style={{fontSize:"10px",letterSpacing:"1.5px",color:"#888",textTransform:"uppercase",marginBottom:"12px"}}>Atualizar Caixa (USD)</div>
        <div style={{display:"flex",gap:"12px",marginBottom:"12px"}}>
          <div style={{flex:1}}>
            <label style={{fontSize:"11px",color:"#00BFA6",display:"block",marginBottom:"4px"}}>Viagem Salvo ($)</label>
            <input type="number" value={savedViagem} onChange={e => setSavedViagem(Number(e.target.value))} style={{width:"100%",padding:"10px",borderRadius:"6px",border:"1px solid #222",background:"#000",color:"#fff",fontFamily:"'Outfit'"}} />
          </div>
          <div style={{flex:1}}>
            <label style={{fontSize:"11px",color:"#A0A0A0",display:"block",marginBottom:"4px"}}>Apple Salvo ($)</label>
            <input type="number" value={savedApple} onChange={e => setSavedApple(Number(e.target.value))} style={{width:"100%",padding:"10px",borderRadius:"6px",border:"1px solid #222",background:"#000",color:"#fff",fontFamily:"'Outfit'"}} />
          </div>
        </div>
        <div style={{height:"4px",background:"#222",borderRadius:"2px",overflow:"hidden",marginBottom:"4px"}}><div style={{height:"100%",width:`${pctViagem}%`,background:"#00BFA6"}}/></div>
        <div style={{fontSize:"10px",textAlign:"right",color:"#666"}}>Viagem: {pctViagem}% concluído</div>
      </div>

      {/* Listagem das seções */}
      {FINANCE_SECTIONS.map((s) => {
        const sub = s.items.reduce((a, i) => a + i.value, 0);
        return (
          <div key={s.title} style={{background:"#111",borderRadius:"10px",padding:"16px",marginBottom:"12px",borderLeft:`3px solid ${s.color}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <span style={{fontSize:"20px"}}>{s.icon}</span>
                <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"15px",letterSpacing:"1px",color:"#fff"}}>{s.title}</span>
              </div>
              <span style={{fontSize:"13px",fontWeight:700,color:s.color}}>${sub.toLocaleString()}</span>
            </div>
            {s.items.map((i, idx) => (
              <div key={idx} style={{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#aaa",padding:"3px 0"}}>
                <span>{i.label} {i.card && <span style={{fontSize:"9px",background:"#1a2a4a",color:"#7eb6ff",padding:"2px 4px",borderRadius:"3px"}}>💳</span>}</span>
                <span style={{color: i.card ? "#7eb6ff" : "#ccc"}}>${i.value.toLocaleString()}</span>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

// NOVA ABA: DOCUMENTOS E ANEXOS
function DocsTab({ docs, setDocs }) {
  const [form, setForm] = useState({ title: '', category: 'Voo', link: '', code: '' });

  const addDoc = (e) => {
    e.preventDefault();
    if(!form.title) return;
    setDocs([...docs, { ...form, id: Date.now() }]);
    setForm({ title: '', category: 'Voo', link: '', code: '' });
  };

  const removeDoc = (id) => {
    setDocs(docs.filter(d => d.id !== id));
  };

  const catColors = { "Voo": "#78909C", "Hospedagem": "#00BFA6", "Ingresso": "#FF6B35", "Carro": "#E53935", "Outros": "#A0A0A0" };

  return (
    <div>
      <div style={{fontFamily:"'Bebas Neue', sans-serif",fontSize:"24px",letterSpacing:"2px",color:"#fff",marginBottom:"4px"}}>DOCUMENTOS & ANEXOS</div>
      <div style={{fontSize:"12px",color:"#888",marginBottom:"20px"}}>Salve aqui os links dos PDFs (Google Drive) e códigos de reserva.</div>

      {/* Formulário de Adição */}
      <form onSubmit={addDoc} style={{background:"#111",padding:"16px",borderRadius:"10px",marginBottom:"24px",border:"1px solid #333"}}>
        <div style={{display:"flex",gap:"10px",marginBottom:"10px"}}>
          <input placeholder="Título (ex: Voo Spirit MCO-MIA)" value={form.title} onChange={e=>setForm({...form, title: e.target.value})} style={{flex:2,padding:"10px",borderRadius:"6px",border:"1px solid #222",background:"#000",color:"#fff",fontFamily:"'Outfit'"}} required />
          <select value={form.category} onChange={e=>setForm({...form, category: e.target.value})} style={{flex:1,padding:"10px",borderRadius:"6px",border:"1px solid #222",background:"#000",color:"#fff",fontFamily:"'Outfit'"}}>
            <option>Voo</option><option>Hospedagem</option><option>Ingresso</option><option>Carro</option><option>Outros</option>
          </select>
        </div>
        <div style={{display:"flex",gap:"10px",marginBottom:"12px"}}>
          <input placeholder="Código de Confirmação (opcional)" value={form.code} onChange={e=>setForm({...form, code: e.target.value})} style={{flex:1,padding:"10px",borderRadius:"6px",border:"1px solid #222",background:"#000",color:"#fff",fontFamily:"'Outfit'"}} />
          <input placeholder="Link do PDF ou Site (opcional)" type="url" value={form.link} onChange={e=>setForm({...form, link: e.target.value})} style={{flex:2,padding:"10px",borderRadius:"6px",border:"1px solid #222",background:"#000",color:"#fff",fontFamily:"'Outfit'"}} />
        </div>
        <button type="submit" style={{width:"100%",padding:"12px",background:"#00BFA6",color:"#000",border:"none",borderRadius:"6px",fontWeight:700,cursor:"pointer",fontFamily:"'Outfit'"}}>+ ADICIONAR DOCUMENTO</button>
      </form>

      {/* Lista de Documentos Salvos */}
      {docs.length === 0 ? (
        <div style={{textAlign:"center",padding:"20px",color:"#555",fontSize:"13px"}}>Nenhum documento anexado ainda.</div>
      ) : (
        <div style={{display:"grid",gap:"10px"}}>
          {docs.map(doc => (
            <div key={doc.id} style={{background:"#111",borderLeft:`4px solid ${catColors[doc.category]}`,borderRadius:"8px",padding:"14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:"10px",color:catColors[doc.category],textTransform:"uppercase",fontWeight:700,marginBottom:"4px"}}>{doc.category}</div>
                <div style={{fontSize:"15px",fontWeight:600,color:"#fff",marginBottom:"4px"}}>{doc.title}</div>
                {doc.code && <div style={{fontSize:"12px",color:"#aaa"}}><span style={{color:"#666"}}>Código:</span> <strong style={{color:"#fff",background:"#222",padding:"2px 6px",borderRadius:"4px",letterSpacing:"1px"}}>{doc.code}</strong></div>}
              </div>
              <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                {doc.link && <a href={doc.link} target="_blank" rel="noopener noreferrer" style={{background:"#222",color:"#33CCFF",padding:"8px 12px",borderRadius:"6px",fontSize:"11px",textDecoration:"none",fontWeight:600}}>ABRIR LINK</a>}
                <button onClick={() => removeDoc(doc.id)} style={{background:"transparent",border:"1px solid #444",color:"#888",padding:"8px 10px",borderRadius:"6px",cursor:"pointer"}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ==========================================
// APLICATIVO PRINCIPAL
// ==========================================
function TripPlanner() {
  const [tab, setTab] = useState("dashboard");
  
  // Estados salvos no LocalStorage
  const [checklist, setChecklist] = useLocalStorage("usa2026_checklist", CHECKLIST_DATA);
  const [savedViagem, setSavedViagem] = useLocalStorage("usa2026_savedViagem", 8000);
  const [savedApple, setSavedApple] = useLocalStorage("usa2026_savedApple", 0);
  const [docs, setDocs] = useLocalStorage("usa2026_docs", []);

  // Cálculos Globais de Datas
  const tripStart = new Date("2026-05-09T00:00:00");
  const tripEnd = new Date("2026-05-30T00:00:00");
  const today = new Date();
  const msDay = 1000 * 60 * 60 * 24;
  const daysToTrip = Math.ceil((tripStart - today) / msDay);
  const totalTripDays = Math.ceil((tripEnd - tripStart) / msDay) + 1;

  // Cálculos Financeiros
  const viagemSections = FINANCE_SECTIONS.filter(s => s.goal !== "apple");
  const appleSections = FINANCE_SECTIONS.filter(s => s.goal === "apple");
  const viagemCash = viagemSections.reduce((a, s) => a + s.items.filter(i => !i.card).reduce((b, i) => b + i.value, 0), 0);
  const appleCash = appleSections.reduce((a, s) => a + s.items.filter(i => !i.card).reduce((b, i) => b + i.value, 0), 0);

  const handleTabChange = (newTab) => {
    setTab(newTab);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <div style={{padding:"0 0 40px 0"}}>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

      {/* HEADER */}
      <div style={{padding:"32px 20px 0px",borderBottom:"1px solid #222",position:"sticky",top:0,background:"rgba(13,13,13,0.95)",backdropFilter:"blur(10px)",zIndex:10}}>
        <div style={{fontFamily:"'Bebas Neue', sans-serif",fontSize:"42px",letterSpacing:"3px",lineHeight:1,color:"#fff"}}>USA 2026</div>
        <div style={{fontSize:"13px",color:"#888",marginTop:"4px",letterSpacing:"1px",textTransform:"uppercase"}}>9 mai — 31 mai · FL & MO</div>

        {/* NAVEGAÇÃO */}
        <div style={{display:"flex",overflowX:"auto",marginTop:"20px",scrollbarWidth:"none"}}>
          {[
            { id: "dashboard", label: "Home" },
            { id: "itinerary", label: "Roteiro" },
            { id: "checklist", label: "Check" },
            { id: "tickets", label: "Tickets" },
            { id: "finance", label: "$$$" },
            { id: "docs", label: "Docs" }
          ].map((t) => (
            <button
              key={t.id}
              onClick={() => handleTabChange(t.id)}
              style={{flexShrink:0,padding:"14px 16px",background:"transparent",color:tab===t.id?"#fff":"#666",border:"none",borderBottom:tab===t.id?"2px solid #FF6B35":"2px solid transparent",fontFamily:"'Outfit', sans-serif",fontSize:"13px",fontWeight:tab===t.id?700:500,letterSpacing:"1px",textTransform:"uppercase",cursor:"pointer",transition:"all 0.2s"}}
            >
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* ÁREA DE CONTEÚDO */}
      <div style={{padding:"20px"}}>
        {tab === "dashboard" && <DashboardTab checklist={checklist} daysToTrip={daysToTrip} totalTripDays={totalTripDays} savedViagem={savedViagem} goalViagemEst={viagemCash} />}
        {tab === "itinerary" && <ItineraryTab />}
        {tab === "checklist" && <ChecklistTab checklist={checklist} setChecklist={setChecklist} />}
        {tab === "tickets" && <TicketsTab />}
        {tab === "finance" && <FinanceTab savedViagem={savedViagem} setSavedViagem={setSavedViagem} savedApple={savedApple} setSavedApple={setSavedApple} viagemCash={viagemCash} appleCash={appleCash} />}
        {tab === "docs" && <DocsTab docs={docs} setDocs={setDocs} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TripPlanner />);
    </script>
